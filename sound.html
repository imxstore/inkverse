<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MyInkVerse – Quotes, Anime Lists, K-Drama Recommendations & Digital Creations</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
/*body*/
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Arial,sans-serif;
    background:
    linear-gradient(45deg,#ffffff,#86c3fc);
}
/*card*/
.card{
    width:100%;
    max-width:420px;
    height:700px;
    position:relative;
    overflow:hidden;
    border-radius:22px;
    border:8px solid rgba(255,255,255,.85);
    box-shadow:
    0 20px 60px rgba(0,0,0,.18);
}
/*card image*/
.card img.bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover; 
    filter:
        brightness(.60)
        contrast(1.05)
        saturate(.95);
}
.overlay{
    position:absolute;
    inset:0;
    background:
    linear-gradient(
    180deg,
    transparent 40%,
    rgba(0,0,0,.15) 60%,
    rgba(0,0,0,.55) 100%
    );
}
/*contents*/
.content{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:30px;
}
/*title*/
.title{
    color:white;
    opacity:.9;
    color:rgba(255,255,255,.9);
    text-shadow:0 2px 8px rgba(0,0,0,.4);
}
/*tagline*/
.tagline{
    margin-bottom:10px;
    opacity:.7anime;
    font-weight:500;
    color:rgba(255,255,255,.9);
    text-shadow:0 2px 8px rgba(0,0,0,.4);
}
/*links*/
.links{
    display:flex;
    flex-direction:column;
    gap:12px;
}

/*footer*/
.footer{
    text-align:center;
    color:white;
    margin-top:18px;
    font-size:.8rem;
    opacity:0.8;
}
  /* cursive */
.signature {
            font-family: 'Brush Script MT', cursive;
            font-size: 1.2rem;
            color: #ffffff;
        }
/*modal*/
.modal{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.5);
    z-index:100;
}
.modal.show{
    display:flex;
}
.modal-box{
    position:relative;
    width:90%;
    max-width:380px;
    padding:20px;
    border-radius:18px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(20px);
    display:flex;
    flex-direction:column;
    gap:12px;
}
.modal-box h2{
    color:white;
    text-align:center;
    margin-bottom:10px;
}


.list-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    margin-bottom:10px;
    border-radius:16px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
}

.list-item:last-child{
    margin-bottom:0;
}
</style>

</head>
<body>
    
    <div class="card">
    <img src="sp.jpg" class="bg">
       <div class="overlay"></div>
       <div class="content">
   <h1 class="title">𝙼𝚢𝙸𝚗𝚔𝚅𝚎𝚛𝚜𝚎</h1>
   <h4 class="tagline" >Trending in Sound Vally</h4>
   
   
    <div class="links">
      <div id="InkModal">
    <div>
        <p id="modalText" class="footer"></p>
    </div>
</div>
    </div>
    
<!--footer -->
    <div class="footer">
           <p>
                <span>made with ink |</span>
                <span style="font-size:1.2rem;" class="signature"> Sujata</span>
            </p>
    </div>
</div>
</div>

</body>

<script>
    const modal = document.getElementById("InkModal");
const modalText = document.getElementById("modalText");

function showModal(content) {
    modalText.innerHTML = content;
    modal.classList.add("show");
}



const trendingMusic = [
    {title: "Aaj Ki Raat", artist: "Madhubanti Bagchi"},
    {title: "Tauba Tauba", artist: "Karan Aujla"},
    {title: "Jo Tum Mere Ho", artist: "Anuv Jain"},
    {title: "Heeriye", artist: "Arijit Singh"},
    {title: "Maan Meri Jaan", artist: "King"}
];

function showList(items){
    let html = "";
    items.forEach(item => {
        html += `
<div class="list-item">
    <span>${item.title}</span>
    <span>${item.artist}</span>
</div>
`;
    });

    showModal(html);
}

showList(trendingMusic)
</script>
</html>
