<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
/*body*/
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Arial,sans-serif;
    background:
    linear-gradient(45deg,#ffffff,#86c3fc);
}
/*card*/
.card{
    width:100%;
    max-width:420px;
    height:700px;
    position:relative;
    overflow:hidden;
    border-radius:22px;
    border:8px solid rgba(255,255,255,.85);
    box-shadow:
    0 20px 60px rgba(0,0,0,.18);
}
/*card image*/
.card img.bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover; 
    filter:
        brightness(.60)
        contrast(1.05)
        saturate(.95);
}
.overlay{
    position:absolute;
    inset:0;
    background:
    linear-gradient(
    180deg,
    transparent 40%,
    rgba(0,0,0,.15) 60%,
    rgba(0,0,0,.55) 100%
    );
}
/*contents*/
.content{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:30px;
}
/*title*/
.title{
    color:white;
    opacity:.9;
    color:rgba(255,255,255,.9);
    text-shadow:0 2px 8px rgba(0,0,0,.4);
}
/*tagline*/
.tagline{
    margin-bottom:10px;
    opacity:.7anime;
    font-weight:500;
    color:rgba(255,255,255,.9);
    text-shadow:0 2px 8px rgba(0,0,0,.4);
}
/*links*/
.links{
    display:flex;
    flex-direction:column;
    gap:12px;
}
.link{
    display:flex;
    justify-content:space-between;
    align-items:center;
    text-decoration:none;
    color:white;
    padding:15px 18px;
    border-radius:12px;
    background:
    linear-gradient(
    45deg,
    rgba(255,131,61,.90),
    rgba(255,169,82,.40)
    );
    backdrop-filter:blur(8px);
    transition:.25s;
}
.link:hover{
    transform:translateY(-2px);
}
/*icon*/
.icon{
    font-size:18px;
}
/*footer*/
.footer{
    text-align:center;
    color:white;
    margin-top:18px;
    font-size:.8rem;
    opacity:0.8;
}
  /* cursive */
.signature {
            font-family: 'Brush Script MT', cursive;
            font-size: 1.2rem;
            color: #ffffff;
        }
/*modal*/
.modal{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.5);
    z-index:100;
}
.modal.show{
    display:flex;
}
.modal-box{
    position:relative;
    width:90%;
    max-width:380px;
    padding:20px;
    border-radius:18px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(20px);
    display:flex;
    flex-direction:column;
    gap:12px;
}
.modal-box h2{
    color:white;
    text-align:center;
    margin-bottom:10px;
}

.close-btn{
    position:absolute;
    top:12px;
    right:12px;
    width:36px;
    height:36px;
    border:none;
    border-radius:50%;
    background:linear-gradient(
    45deg,
    rgba(255,131,61,.90),
    rgba(255,169,82,.40)
    );
    color:white;
    font-size:20px;
    cursor:pointer;
    backdrop-filter:blur(10px);
}
</style>

function showModal(title, items) {
    modalTitle.textContent = title;
    modalLinks.innerHTML = items.map(item => `

    modal.classList.add("show");
}

function closeModal() {
    modal.classList.remove("show");
}
