<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MYINKVERSE | Home</title><style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Arial,sans-serif;

    background:
    linear-gradient(45deg,#ffffff,#86c3fc);
}

.card{
    width:100%;
    max-width:420px;
    height:700px;

    position:relative;
    overflow:hidden;

    border-radius:22px;
    border:8px solid rgba(255,255,255,.85);

    box-shadow:
    0 20px 60px rgba(0,0,0,.18);
}

.card img.bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

.overlay{
    position:absolute;
    inset:0;

    background:
    linear-gradient(
    180deg,
    transparent 40%,
    rgba(0,0,0,.15) 60%,
    rgba(0,0,0,.55) 100%
    );
}

.content{
    position:relative;
    z-index:2;

    height:100%;

    display:flex;
    flex-direction:column;
    justify-content:flex-end;

    padding:30px;
}

h1{
    color:white;
    font-size:2.4rem;
    font-weight:700;
    margin-bottom:8px;
    text-shadow:0 4px 15px rgba(0,0,0,.35);
}

.links{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.link{
    display:flex;
    justify-content:space-between;
    align-items:center;
    text-decoration:none;
    color:white;
    padding:15px 18px;
    border-radius:12px;
    background:
    linear-gradient(
    45deg,
    rgba(255,131,61,.90),
    rgba(255,169,82,.40)
    );
    backdrop-filter:blur(8px);
    transition:.25s;
}

.link:hover{
    transform:translateY(-2px);
}

.icon{
    font-size:18px;
}

.footer{
    text-align:center;
    color:white;
    margin-top:18px;
    font-size:.8rem;
    opacity:.8;
}
.quote{
    font-family:
    "Brush Script MT",
    "Segoe Script",
    "Lucida Handwriting",
    cursive;

    font-size:1.15rem;
    color:white;
    opacity:.9;

    margin-bottom:20px;
    text-shadow:0 2px 8px rgba(0,0,0,.3);
}
  /* misc */
        .signature {
            font-family: 'Brush Script MT', cursive;
            font-size: 1.6rem;
            color: #ffffff;
            opacity: 0.8;
        }
</style>

</head>
<body>
    
    <div class="card"><img src="photo.jpg" class="bg">

<div class="overlay"></div>

<div class="content">
<p class="quote">"Leave it better than you found it."</p>
    <div class="links">

        <a class="link" href="#">
            <span>@imxstore</span>
            <span class="icon">🎵</span>
        </a>

        <a class="link" href="#">
            <span>@myinkverse</span>
            <span class="icon">📷</span>
        </a>

        <a class="link" href="#">
            <span>@mady</span>
            <span class="icon">✕</span>
        </a>

        <a class="link" href="https://imxstore.in">
            <span>Store</span>
            <span class="icon">🛍</span>
        </a>

    </div>

    <div class="footer">
          <p>
                <span class="signature" style="font-size:1.2rem;">❤ with love</span>
                <span> Madan Sidar</span>
            </p>
    </div>

</div>

</div></body>
</html>
