<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Arial,sans-serif;
    background:
    linear-gradient(45deg,#ffffff,#86c3fc);
}


.card{
    width:100%;
    max-width:420px;
    height:700px;
    position:relative;
    overflow:hidden;
    border-radius:22px;
    border:8px solid rgba(255,255,255,.85);
    box-shadow:
    0 20px 60px rgba(0,0,0,.18);
}

.card img.bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover; 
    filter:
        brightness(.60)
        contrast(1.05)
        saturate(.95);
}

.overlay{
    position:absolute;
    inset:0;
    background:
    linear-gradient(
    180deg,
    transparent 40%,
    rgba(0,0,0,.15) 60%,
    rgba(0,0,0,.55) 100%
    );
}

.content{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:30px;
}


.title{
    color:white;
    opacity:.9;
    color:rgba(255,255,255,.9);
    text-shadow:0 2px 8px rgba(0,0,0,.4);
}


.tagline{
    margin-bottom:10px;
    opacity:.7anime;
    font-weight:500;
    color:rgba(255,255,255,.9);
    text-shadow:0 2px 8px rgba(0,0,0,.4);
}

.links{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.link{
    display:flex;
    justify-content:space-between;
    align-items:center;
    text-decoration:none;
    color:white;
    padding:15px 18px;
    border-radius:12px;
    background:
    linear-gradient(
    45deg,
    rgba(255,131,61,.90),
    rgba(255,169,82,.40)
    );
    backdrop-filter:blur(8px);
    transition:.25s;
}


.link:hover{
    transform:translateY(-2px);
}

.icon{
    font-size:18px;
}

.footer{
    text-align:center;
    color:white;
    margin-top:18px;
    font-size:.8rem;
    opacity:0.8;
}
